name: Bug report
description: Something in Verdict itself misbehaves (the agent, the hooks, the harness, the MCP server, verdict-gate, or the Action).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This template mirrors Verdict's own bug-report standard: expected and actual
        stated separately, evidence cited, reproduction from a clean start. If you are
        reporting a *QA finding Verdict produced about your project*, that belongs in
        your project — not here; this tracker is for defects in the tool.
  - type: input
    id: version
    attributes:
      label: Verdict version
      description: "`/plugin list` shows it, or the `version` field in `.claude-plugin/plugin.json`; `verdict-gate --help` for the PyPI half"
      placeholder: "0.77.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - agent prompt / verdict behavior
        - a /verdict:* command
        - scope-guard hooks (write / bash / stop / session banner)
        - harness (verdict-facts / verdict-finalize / verdict-run)
        - state validator (verdict-validate)
        - verdict-mcp server
        - verdict-gate CLI
        - verdict-issues / verdict-accept
        - GitHub Action
        - eval suite / fixtures / pin_check
        - docs
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a clean start. Include the exact command or prompt.
      placeholder: |
        1. /verdict:baseline solo
        2. /verdict:run
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the exact output. **Redact secrets** — Verdict never prints them, but your terminal might.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        The relevant slice of `state.json`, the report file, the gate's exit code, or the
        hook's stderr. A finding without a citation is a hypothesis — same rule applies here.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15.5 · Claude Code 2.1.245 · model: opus · python3 --version"
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options: ["always", "intermittent", "seen once"]
