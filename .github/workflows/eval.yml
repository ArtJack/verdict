name: eval

# Model-run evals cost real tokens: manual dispatch plus a weekly run on the
# canonical repo only. Results are artifacts — this workflow never gates a PR.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "seeded | live | baseline"
        default: "seeded"
      model:
        description: "model for the run"
        default: "opus"
  schedule:
    - cron: "17 9 * * 1"

jobs:
  model-eval:
    if: github.repository == 'ArtJack/verdict'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the eval
        # `shell: bash` is `bash -eo pipefail`: with the default shell the job's
        # status was `tee`'s, so a run that failed in the first second — no API
        # key in the repository's secrets, "claude run failed rc=1" in a
        # 422-byte artifact — reported success every week and never produced a
        # score (audit 2026-10-02, D-D-2). The missing key is said up front.
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set in this repository's secrets — no model can run, nothing was measured"
            exit 2
          fi
          python3 eval/run_eval.py \
            --mode "${{ github.event.inputs.mode || 'seeded' }}" \
            --model "${{ github.event.inputs.model || 'opus' }}" \
            | tee eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-results.json
