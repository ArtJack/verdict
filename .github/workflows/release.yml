name: release

# Publishes `verdict-qa-mcp` to PyPI via Trusted Publishing (OIDC). There is no
# API token in this repository and none in the maintainer's shell: PyPI verifies
# the workflow's identity instead. A leaked token is the usual way a small
# package gets hijacked, so the safest token is the one that does not exist.
#
# Fires on a version tag. Tag only what is already green on main — the tests run
# again here anyway, because a QA tool that publishes an unrun suite would be
# arguing against itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml builds the *previous* version and
      # PyPI refuses the duplicate — after the suite has run and the build has
      # succeeded, with the tag already pushed. The first v0.51.0 did exactly
      # that: its bump commit landed one commit after its content. Refuse here,
      # before anything expensive or hard to undo, and check plugin.json too:
      # the changelog says the two are bumped together, so hold it to that.
      - name: Refuse a tag that disagrees with the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          read -r pyproject plugin <<EOF
          $(python3 -c 'import json, tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"], json.load(open(".claude-plugin/plugin.json"))["version"])')
          EOF
          ok=1
          [ "$want" = "$pyproject" ] || { echo "::error::tag v$want but pyproject.toml says $pyproject — bump before tagging"; ok=0; }
          [ "$want" = "$plugin" ]    || { echo "::error::tag v$want but .claude-plugin/plugin.json says $plugin — the two are bumped together"; ok=0; }
          [ "$ok" = 1 ]

      - name: Run the suite before building anything
        run: uv run --group dev python -m pytest tests/

      - name: Build sdist and wheel
        run: uv build

      # Catches a README that PyPI would reject, and prints what is actually in
      # the sdist — the 0.36.0 build swept in 332 files of agent worktrees
      # because hatchling honours .gitignore but not .git/info/exclude.
      - name: Check metadata and show sdist contents
        run: |
          uv run --with twine twine check dist/*
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | sort | head -40
          echo "sdist entries: $(tar -tzf dist/*.tar.gz | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name in the PyPI trusted publisher exactly, or
    # the OIDC exchange is refused.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
