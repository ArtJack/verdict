name: release

# Publishes `verdict-qa-mcp` to PyPI via Trusted Publishing (OIDC). There is no
# API token in this repository and none in the maintainer's shell: PyPI verifies
# the workflow's identity instead. A leaked token is the usual way a small
# package gets hijacked, so the safest token is the one that does not exist.
#
# Fires on a version tag. Tag only what is already green on main — the tests run
# again here anyway, because a QA tool that publishes an unrun suite would be
# arguing against itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml builds the *previous* version and
      # PyPI refuses the duplicate — after the suite has run and the build has
      # succeeded, with the tag already pushed. The first v0.51.0 did exactly
      # that: its bump commit landed one commit after its content. Refuse here,
      # before anything expensive or hard to undo, and check plugin.json too:
      # the changelog says the two are bumped together, so hold it to that.
      - name: Refuse a tag that disagrees with the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          read -r pyproject plugin server package <<EOF
          $(python3 -c 'import json, tomllib; s = json.load(open("server.json")); print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"], json.load(open(".claude-plugin/plugin.json"))["version"], s["version"], s["packages"][0]["version"])')
          EOF
          ok=1
          [ "$want" = "$pyproject" ] || { echo "::error::tag v$want but pyproject.toml says $pyproject — bump before tagging"; ok=0; }
          [ "$want" = "$plugin" ]    || { echo "::error::tag v$want but .claude-plugin/plugin.json says $plugin — the two are bumped together"; ok=0; }
          # server.json is the MCP registry's copy of the same number. It sat three
          # releases behind the other two while the registry showed a version six
          # months of work older than the code; the three move together now.
          [ "$want" = "$server" ] && [ "$want" = "$package" ] || { echo "::error::tag v$want but server.json says $server / packages[0] $package — all three manifests carry one version"; ok=0; }
          [ "$ok" = 1 ]
          # And the notes must exist before anything is published: a release
          # without notes is a claim, and the Releases page is where a visitor
          # looks first.
          python3 .github/release_notes.py "$want" > /dev/null

      - name: Run the suite before building anything
        run: uv run --group dev python -m pytest tests/

      - name: Build sdist and wheel
        run: uv build

      # Catches a README that PyPI would reject, and prints what is actually in
      # the sdist — the 0.36.0 build swept in 332 files of agent worktrees
      # because hatchling honours .gitignore but not .git/info/exclude.
      - name: Check metadata and show sdist contents
        run: |
          uv run --with twine twine check dist/*
          tar -tzf dist/*.tar.gz | sed 's|^[^/]*/||' | sort | head -40
          echo "sdist entries: $(tar -tzf dist/*.tar.gz | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name in the PyPI trusted publisher exactly, or
    # the OIDC exchange is refused.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The Releases page, from the CHANGELOG. Every version has had notes since
  # the beginning — written before the tag, in the project's voice — and the
  # page still stopped at v0.21.0 while the tags ran to v0.76.0, because
  # nothing copied them there. A repository whose latest release is fifty
  # tags behind its code reads as abandoned, whatever the commit log says.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 .github/release_notes.py "$v" > notes.md
          title="$(python3 .github/release_notes.py "$v" --title)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag
          fi

  # The MCP Server Registry entry for `io.github.ArtJack/verdict`, kept at the
  # version PyPI has. It was published once by hand at 0.49.0 and never again.
  # Authenticated by the workflow's OIDC identity — the namespace is the
  # repository owner's, so no token exists to leak. It runs after the PyPI
  # publish, so a failure here leaves the release where PyPI put it and shows
  # red rather than being swallowed: a job that hands an OIDC identity to a
  # downloaded binary must not also hide what that binary did (VERDICT-F-73).
  mcp-registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher (pinned, checksummed)
        # A `releases/latest` download with no checksum, executed in a job
        # holding an OIDC identity, is a supply-chain hole: whatever that
        # repository published next would run here with this namespace's
        # credentials (VERDICT-F-73). Pinned to one release and to the sha256
        # the registry publishes beside it (registry_<v>_checksums.txt); bump
        # both together.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Wait for PyPI to serve the version the registry will verify
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            curl -sf "https://pypi.org/pypi/verdict-qa-mcp/$v/json" > /dev/null && exit 0
            sleep 15
          done
          echo "::error::PyPI has not served $v after five minutes — the registry would verify against a package that is not there"
          exit 1
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
