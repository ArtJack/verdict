name: codeql

# Security queries over the code this project ships. Ruff runs correctness rules
# only (ci.yml), so without this nothing here looks for an injection or a path
# escape. eval/fixtures and tests/ stay out: the seeded defects and the fake
# secrets in them are there on purpose, and an alert on one is noise.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - eval/fixtures
              - tests
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
