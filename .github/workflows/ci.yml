name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Correctness rules only — pyflakes, syntax errors, complexity, ambiguous
      # names. Not `ruff format`: the narrative comment layout in this repo is
      # deliberate, and reformatting it would churn every file for no gain.
      - run: uv run --with ruff ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite (server, hooks, scorer)
        # no -q here: pyproject addopts already carries it, and -q + -q = -qq
        # suppresses the countable summary line (VERDICT-F-3 — our own liar
        # fixture's trap, found living in our own CI)
        run: uv run --group dev python -m pytest tests/

  hooks-floor:
    # `hooks.json` starts every hook with `python3`, and on a stock Mac that is 3.9 —
    # below this package's own floor, which binds pip and not a plugin. The matrix
    # above never ran the hooks' tests on it: the "floor" was an AST shape check, so
    # a 3.10-only stdlib call would have passed CI and broken the guard on the one
    # machine class it is installed on most (audit 2026-10-02, D-D-26). pytest itself
    # runs on 3.9 here, no project install: the hooks are stdlib and so are their tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the hook tests on Python 3.9
        run: >-
          uv run --no-project --python 3.9 --with pytest python -m pytest
          -p no:cacheprovider -o addopts=
          tests/test_hooks.py tests/test_hooks_0903.py tests/test_hooks_pens.py
          tests/test_hooks_links.py tests/test_stop_hook.py tests/test_session_start.py
          tests/test_validate_hook_scope.py tests/test_interpreter_floor.py

  delta-diff-freshness:
    # eval/fixtures/pricer-delta.diff is the tamper-evidence for the delta
    # fixture: any drift between rev-A, rev-B, and the committed diff fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and compare
        # One definition, shared with the profile's gate. The inline version
        # this replaces used `git diff --no-index`, which does not honour
        # .gitignore: running the fixture's own tests once produced
        # __pycache__/ and the gate reported tampering of a file nobody
        # touched. A tamper alarm that fires on build artifacts is one people
        # learn to ignore.
        run: python3 eval/fixture_freshness.py
